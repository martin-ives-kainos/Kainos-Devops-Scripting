# File: step-windows-latest-build-server-prereq.yaml@templates
# --------------------------------------
#   - template: step-windows-latest-build-server-prereq.yaml@templates
#     parameters:
#       UpdateApt: false
#       terraformVersion: '1.7.4'
# --------------------------------------
parameters:
  - name: UpdateApt
    type: boolean
    default: false
  - name: terraformVersion
    type: string
    default: '1.7.4'

steps:
# --------------------------------------
  - template: step-SearchFilePath.yml@templates
    parameters:
      FileName: ChocoInstallPackages.ps1
      RootFolder: $(Build.SourcesDirectory)
      varName: 'Choco.Script.File.Path'
      ReturnFullPath: true
# --------------------------------------

  - task: TerraformInstaller@1
    inputs:
      terraformVersion: '${{ parameters.terraformVersion }}'
  - task: ChocolateyToolInstaller@1
  - task: PowerShell@2
    displayName: "[PREREQ]Install Chocolatey Packages"
    inputs:
      filePath: '$(Choco.Script.File.Path)'
      arguments: ''
      pwsh: true
    enabled: true
