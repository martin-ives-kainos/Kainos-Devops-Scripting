# File: step-diag-display-params.yml@templates
# --------------------------------------
#   - template: step-diag-display-params.yml@templates
#     parameters:
#       ParamValues:
#       - Name: 'paramName'
#         Value: 'paramValue'
#       Header: 'step-diag-display-params.yml'
#       ShowParams: ${{ parameters.ShowParams }}
# --------------------------------------
parameters:
  - name: ParamValues
    type: object
  - name: Header
    type: string
    default: $(Build.SourcesDirectory)
  - name: ShowParams
    type: boolean
    default: false

steps:
# ----------------------------------------------------------
- task: PowerShell@2
  displayName: 'DIAG: ${{ parameters.Header }}'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "${{ convertToJson(parameters.ParamValues) }}"
      $pValues = "${{ convertToJson(parameters.ParamValues) }}" | ConvertFrom-Json
      Write-Host '| ----- ${{ parameters.Header }}----- |'
      foreach ($p in $pValues) {
          Write-Host ('| {0} : {1} |' -f $p.Name, $p.Value )
      }
    showWarnings: true
    pwsh: true
  enabled: ${{ parameters.ShowParams }}
# ----------------------------------------------------------
