# File: step-env-build-Update-ElasticSearchIndices.yml@templates
# --------------------------------------
#   - template: step-env-build-Update-ElasticSearchIndices.yml@templates
#     parameters:
#       VNextRegion: '${{ parameters.VNextRegion}}'
#       AppAbbrev: 'Pano'
#       ProjectName: 'Panopticon'
#       DeploySlot: '${{ parameters.DeploySlot}}'
#       p_name: 'p_value'
#       p_name: 'p_value'
#       p_name: 'p_value'
#       p_name: 'p_value'
#       p_name: 'p_value'
#       p_name: 'p_value'
#       p_name: 'p_value'
#       p_name: 'p_value'
#       p_name: 'p_value'
# Note: 'create' command exits without changes if the index already exists.
# --------------------------------------
parameters:
- name: VNextRegion
  type: string
- name: AppAbbrev
  type: string
- name: ShowParams
  type: boolean
  default: false

steps:
# ----------------------------------------------------------
- task: PowerShell@2
  displayName: '[debug]: step-env-build-Update-ElasticSearchIndices'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host '-----Template: step-env-build-Update-ElasticSearchIndices-----'
      Write-Host '      : ${{ parameters. }}'
    showWarnings: true
    pwsh: true
  enabled: ${{ parameters.ShowParams }}
# --------------------------------------
- template: step-Search-Files-Path.yml@templates
  parameters:
    FileNames:
    - Name: 'eb.exe'
      VarName: 'eb.exe.File.Path'
    RootFolder: $(Build.SourcesDirectory)
    ReturnFullPath: true
# --------------------------------------
- task: PowerShell@2
  displayName: 'Update Elastic indices'
  inputs:
    errorActionPreference: Stop
    targetType: inline
    script: |
      # Including sleep command here because getting repeating connection failures
      Start-Sleep -Seconds 30
# >>>       $elasticBandExe = "$(Build.SourcesDirectory)\src\Core\Lexacom.Core.ElasticBand\bin\Debug\net6.0\win-x64\eb.exe"
# >>>       $sharedVars = '-u "$(cicd-0-1-0-elasticUri)" -a "$(Build.SourcesDirectory)\src\Panopticon\Lexacom.Panopticon.Core\bin\Release\net6.0\Lexacom.Panopticon.Core.dll" -t "Lexacom.Panopticon.Core.Autofac.ElasticModule" --bastion "pipelineagent@$(cicd-0-1-0-bastionHost)" --sshkey "$(pipelineAgentKey.secureFilePath)" -c "StoreName=My;StoreLocation=LocalMachine;Thumbprint=$(cicd-0-1-0-elasticAdminThumbprint)"'
# >>>       $sharedVars = $sharedVars.Split(" ")
# >>>       & $elasticBandExe $sharedVars --command create --arg1 panopticon_users --arg2 panopticon_users
# >>>       & $elasticBandExe $sharedVars --command update --arg1 panopticon_users --arg2 panopticon_users
# >>>       & $elasticBandExe $sharedVars --command create --arg1 panopticon_teams --arg2 panopticon_teams
# >>>       & $elasticBandExe $sharedVars --command update --arg1 panopticon_teams --arg2 panopticon_teams
  env:
    ELASTICBAND_KEYPASS: $(cicd-0-1-0-sshKeyPass)
