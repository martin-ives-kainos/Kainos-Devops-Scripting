# File: step-env-build-WebPack.yml@templates
# --------------------------------------
#   - template: step-env-build-WebPack.yml@templates
#     parameters:
#       AppAbbrev: 'Pano'
# ----------------
#       AuthorityUri: '$(cicd-0-1-0-AuthorityUri)'
# ----------------
# ----------------
#       LoginClientId: '$(alex-1-0-0-Auth--ServiceClientId)'
#       LoginClientId: '$(cicd-0-1-0-panoClientId)'
#       LoginClientId: '$(cicd-0-1-0-teamAdmin--ClientId)'
#       LoginClientId: '$(cicd-0-1-0-testClientId)'
#       LoginClientId: '$(echo-1-0-0-Auth--ServiceClientId)'
#       LoginClientId: '$(maho-1-0-0-service--clientid)'
#       LoginClientId: '$(pano-0-14-0-Auth--ServiceClientId)'
# ----------------
#       ReleaseSourceDir: '$(Build.SourcesDirectory)/lexacom'
#       ScriptName: 'prod-build'
#       SourceJsPath: '$(Build.SourcesDirectory)\lexacom\js'
#       VNextRegion: '${{ parameters.VNextRegion}}'
#       WebpackCsp: '$(cicd-0-1-0-xxxxxCsp)' pano/sardis/teamAdmin
#       YarnVer: '1.22.19'
# --------------------------------------
parameters:
- name: AppAbbrev
  type: string
  default: Pano
- name: AuthorityUri
  type: string
  default: $(cicd-authorityUri)
- name: LoginClientId
  type: string
- name: ReleaseSourceDir
  type: string
  default: '$(Build.SourcesDirectory)\lexacom'
- name: ScriptName
  type: string
  default: 'prod-build'
- name: ShowParams
  type: boolean
  default: false
- name: SourceJsPath
  type: string
- name: VNextRegion
  type: string
  default: uae
- name: WebpackCsp
  type: string
- name: YarnVer
  type: string
  default: '1.22.19'
# ----------------------------------------------------------
steps:
- task: PowerShell@2
  displayName: '[debug]: step-env-build-WebPack'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host '-----Template: step-env-build-WebPack-----'
      Write-Host ' AppAbbrev       : ${{ parameters.AppAbbrev }}'
      Write-Host ' AuthorityUri    : ${{ parameters.AuthorityUri }}'
      Write-Host ' LoginClientId   : ${{ parameters.LoginClientId }}'
      Write-Host ' ScriptName      : ${{ parameters.ScriptName }}'
      Write-Host ' SourceJsPath    : ${{ parameters.SourceJsPath }}'
      Write-Host ' ReleaseSourceDir: ${{ parameters.ReleaseSourceDir }}'
      Write-Host ' VNextRegion     : ${{ parameters.VNextRegion }}'
      Write-Host ' WebpackCsp      : ${{ parameters.WebpackCsp }}'
      Write-Host ' YarnVer         : ${{ parameters.YarnVer }}'
    showWarnings: true
    pwsh: true
  enabled: ${{ parameters.ShowParams }}
# --------------------------------------
- template: step-env-build-yarn-install-restore.yml@templates
  parameters:
    YarnVer: '${{ parameters.YarnVer }}'
    SourceRoot: '${{ parameters.ReleaseSourceDir }}'
    WorkingDir:
      - subpath: '/js'
      - subpath: '/js/teamadminapp'
    ShowParams: ${{ parameters.ShowParams }}
# --------------------------------------
- template: step-Search-Files-Path.yml@templates
  parameters:
    FileNames:
    - Name: 'Build-js-Webpack.ps1'
      VarName: 'Build.Webpack.File.Path'
    RootFolder: $(Build.SourcesDirectory)
    ReturnFullPath: true
# --------------------------------------
- task: PowerShell@2
  displayName: '${{ parameters.VNextRegion }} Builds ${{ lower(parameters.AppAbbrev) }} WebPack via PS'
  inputs:
    filePath: $(Build.Webpack.File.Path)
    arguments: >
      -Project "${{ lower(parameters.AppAbbrev) }}"
      -Script "${{ parameters.ScriptName }}"
      -Csp "${{ parameters.WebpackCsp }}"
      -Authority "${{ parameters.AuthorityUri }}"
      -ClientId "${{ parameters.LoginClientId }}"
      -MahonUri '$(cicd-0-1-0-teamAdmin--MahonUri)'
      -EchoUri '$(cicd-0-1-0-echoUri)'
      -EchoSvcId 13
      -MahonSvcId 6

  env:
    SOURCE_JS_PATH: '${{ parameters.SourceJsPath }}'