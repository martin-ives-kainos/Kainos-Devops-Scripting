# File: step-lexacom-cicd-postgres-steps.yml@templates
# --------------------------------------
#   - template: step-lexacom-cicd-postgres-steps.yml@templates
#     parameters:
#       VNextRegion: '${{ parameters.VNextRegion}}'
#       AppAbbrev: 'Pano'
#       ProjectName: 'Panopticon'
#       DeploySlot: '${{ parameters.DeploySlot}}'
#       p_name: ''
#       p_name: ''
#       p_name: ''
#       p_name: ''
#       p_name: ''
#       p_name: ''
# --------------------------------------
parameters:
  - name: VNextRegion
    type: string
    default: uae
    values:
      - uae
  - name: AppAbbrev
    type: string
    default: Pano
  - name: ProjectName
    type: string
    default: Panopticon
  - name: DeploySlot
    type: string
    default: stg
    values:
      - stg
      - prd

steps:
# ---------------------
- task: PowerShell@2
  displayName: 'Add Agent IP rule ${{ parameters.DeploySlot }}_${{ lower(parameters.ProjectName) }}_pipeline_agent Psql Whitelist'
  inputs:
    errorActionPreference: Stop
    targetType: filePath
    filePath: '.\scripts\azure-pipelines\Update-PsqlConnectionIp.ps1'
    arguments: >
      -key "$env:key"
      -clientId "$env:clientId"
      -tenantId "$env:tenantId"
      -subscriptionId "$env:subscriptionId"
      -ruleName "$env:ruleName"
      -postgresHostName: "$env:postgresHostName"
      -postgresRG: "$env:postgresRg"
  env:
      ruleName: "${{ parameters.DeploySlot }}_${{ parameters.ProjectName }}_pipeline_agent"
      postgresHostName: $(cicd-0-1-0-stgDbHost)
      postgresRg: $(cicd-0-1-0-${{ lower(parameters.AppAbbrev) }}WebAppRg)
      key: $(cicd-0-1-0-service-principal-key)
      clientId: $(cicd-0-1-0-service-principal-un)
      tenantId: $(cicd-0-1-0-service-principal-tenant-id)
      subscriptionId: $(cicd-0-1-0-service-principal-subscription-id)
# ---------------------
