# File: step-copy-and-publish-folders.yml@templates
# --------------------------------------
#   - template: step-copy-and-publish-folders.yml@templates
#     parameters:
#       BuildNumber: '$(Build.BuildNumber)'
#       SourceFolder: '$(System.DefaultWorkingDirectory)'
#       TargetFolder: '$(Build.ArtifactStagingDirectory)'
#       listOfFolders:
#         - scripts
#         - scripts-common
#       publish: true
#       enabled: true
# --------------------------------------
parameters:
  - name: BuildNumber
    type: string
    default:  '$(Build.BuildNumber)'
  - name: SourceFolder
    type: string
    default:  '$(System.DefaultWorkingDirectory)'
  - name: TargetFolder
    type: string
    default:  '$(Build.ArtifactStagingDirectory)'
  - name: listOfFolders
    displayName: List of source folder names
    type: object
    default:
    - scripts
    - scripts-common
  - name: publish
    type: boolean
    default: true
  - name: enabled
    type: boolean
    default: true

steps:
  - ${{ each folderName in parameters.listOfFolders }}:
    - task: PowerShell@2
      displayName: '[pwsh] Copy ${{ folderName }} ${{ parameters.SourceFolder }} to ${{ parameters.TargetFolder }}'
      inputs:
        targetType: 'inline'
        script: |
          # Write your PowerShell commands here.
          $SourceFolder = (Join-Path '${{ parameters.SourceFolder }}' '${{ folderName }}')
          $TargetFolder = '${{ parameters.TargetFolder }}'
          New-Item $TargetFolder -ItemType Directory -Force
          Copy-Item $SourceFolder -Destination $TargetFolder -Recurse
        showWarnings: true
        pwsh: true
      enabled: ${{ parameters.enabled }}
    - task: PublishBuildArtifacts@1
      condition: and(succeeded(), eq('${{ parameters.publish }}', 'true'))
      displayName: Publish ${{ folderName }} Artifacts
      inputs:
        PathtoPublish: '${{ parameters.TargetFolder }}/${{ folderName }}'
        ArtifactName: '${{ folderName }}'
        publishLocation: 'Container'
      enabled: ${{ parameters.enabled }}