# File: step-Display-Folder-Structure.yml@templates
# --------------------------------------
#   - template: step-Display-Folder-Structure.yml@templates
#     parameters:
#       RootFolder: '$(Build.SourcesDirectory)'
#       azureSubscription: 'service connection'
#       enabled: true
# --------------------------------------
parameters:
  - name: RootFolder
    type: string
    default: $(Build.SourcesDirectory)
  - name: azureSubscription
    type: string
  - name: enabled
    type: boolean
    default: true

steps:
  - task: AzurePowerShell@5
    displayName: 'Display Directory: ${{ parameters.RootFolder }}'
    inputs:
      azureSubscription: '${{ parameters.azureSubscription }}'
      ScriptType: 'InlineScript'
      Inline: |
        Write-Host "Root files: ${{ parameters.RootFolder }}"
        foreach ($file in (Get-ChildItem ${{ parameters.RootFolder }} -File -Force | Sort-Object { $_.Name })) {
            Write-Host "   $($file.Name)"
        }

        Get-ChildItem -Path ${{ parameters.RootFolder }} -Directory -Recurse -Force | Sort-Object { $_.FullName } | ForEach-Object {
            if ($_.Name -ne '.git') {
                Write-Host "DIR: $($_.FullName)"
                foreach ($file in (Get-ChildItem $_.DirectoryName -File -Force | Sort-Object { $_.Name })) {
                    Write-Host "   $($file.Name)"
                }
            }
        }
      azurePowerShellVersion: 'LatestVersion'
      pwsh: true
    enabled: ${{ parameters.enabled }}
