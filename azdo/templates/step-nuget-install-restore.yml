# File: step-nuget-install-restore.yml@templates
# --------------------------------------
#   - template: step-nuget-install-restore.yml@templates
#     parameters:
#       versionSpec: '6.0.0'
#       forceReinstallCredentialProvider: true
#       InstallNugetAuth: false
# --------------------------------------
parameters:
- name: versionSpec
  type: string
  default: '6.0.0'
- name: forceReinstallCredentialProvider
  type: boolean
  default: true
- name: InstallNugetAuth
  type: boolean
  default: true

steps:
- task: NuGetToolInstaller@1
  displayName: 'Nuget Install ${{ parameters.versionSpec }}'
  inputs:
    versionSpec: ${{ parameters.versionSpec }}
- ${{ if eq(parameters.InstallNugetAuth, 'true') }}:
  - task: NuGetAuthenticate@1
    displayName: 'Nuget Auth ${{ parameters.versionSpec }}'
    inputs:
      forceReinstallCredentialProvider: ${{ parameters.versionSpec }}
