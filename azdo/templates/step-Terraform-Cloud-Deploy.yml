# File: step-Terraform-Cloud-Deploy.yml@templates
# --------------------------------------
#   - template: step-Terraform-Cloud-Deploy.yml@templates
#     parameters:
#       EnvPrefix: 'prd'
#       Location: 'uae'
#       azureSubscription: 'name/id'
#       SvcPrincipleId: 'SvcPrincipleId'
#       Token: 'Token'
#       runTfLint: true
#       runTfApply: false
#       HostName: 'app.terraform.io'
#       enabled: true
#       AdoPat: '$(azure_devops_pat)'
#       BuildNumber: '$(Build.BuildNumber)'
#       BuildOutputFolder: '$(Build.ArtifactStagingDirectory)/GenConfig'
#       BuildSourceFolder: '$(Build.SourcesDirectory)'
#       SaveSecretsToKeyVault: true
#       displayFolderStructure: false
# --------------------------------------
parameters:
  - name: EnvPrefix
    type: string
  - name: Location
    type: string
  - name: azureSubscription
    type: string
  - name: SvcPrincipleId
    type: string
  - name: Token
    type: string
    default: true
  - name: runTfLint
    type: boolean
  - name: runTfApply
    type: boolean
    default: false
  - name: HostName
    type: string
    default: app.terraform.io
  - name: enabled
    type: boolean
    default: true
  - name: AdoPat
    type: string
    default: $(azure_devops_pat)
  - name: BuildNumber
    type: string
  - name: BuildOutputFolder
    type: string
    default: '$(Build.ArtifactStagingDirectory)/GenConfig'
  - name: BuildSourceFolder
    type: string
    default: '$(Build.SourcesDirectory)'
  - name: SaveSecretsToKeyVault
    type: boolean
    default: true
  - name: displayFolderStructure
    type: boolean
    default: false

steps:
  - template: step-Display-Folder-Structure.yml@templates
    parameters:
      RootFolder: ${{ parameters.BuildSourceFolder }}
      azureSubscription: '${{ parameters.azureSubscription }}'
      enabled: ${{ parameters.displayFolderStructure }}
# -------------------------------------------------------
  - template: step-Search-Files-Path.yml@templates
    parameters:
      FileNames:
        - Name: 'Build-Generate-Config.ps1'
          VarName: 'GenConfig.Script.File.Path'
        - Name: '.tflint.hcl'
          VarName: 'tflint.hcl.File.Path'
      RootFolder: ${{ parameters.BuildSourceFolder }}
      ReturnFullPath: true
# -------------------------------------------------------
  - task: PowerShell@2
    displayName: Generate Configuration
    inputs:
      filePath: "$(GenConfig.Script.File.Path)"
      arguments: "-EnvPrefix ${{ parameters.EnvPrefix }} -Location ${{ parameters.Location }} -SvcPrincipleId ${{ parameters.SvcPrincipleId }} -VaultPwdVarName 'AnsibleVaultPass' -BuildOutputFolder '${{ parameters.BuildOutputFolder }}'"
      pwsh: true
    enabled: ${{ parameters.enabled }}
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
  - task: PublishBuildArtifacts@1
    displayName: Publish GenConfig Artifacts
    inputs:
      PathtoPublish: '${{ parameters.BuildOutputFolder }}'
      ArtifactName: 'GenConfig'
      publishLocation: 'Container'
    enabled: true
  - task: replacetokens@6
    displayName: Replace tokens in $(tflint.hcl.File.Path)
    inputs:
      root: '$(System.DefaultWorkingDirectory)'
      sources: '$(tflint.hcl.File.Path)'
      tokenPattern: 'custom'
      tokenPrefix: '{'
      tokenSuffix: '}'
      escape: 'off'
      missingVarAction: 'replace'
      ifNoFilesFound: 'error'
  - template: step-copy-and-publish-files.yaml@templates
    parameters:
      Name: hclFiles
      SourceFolder: '$(System.DefaultWorkingDirectory)'
      Contents: '*.hcl'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      publish: true
      enabled: true
  - template: step-copy-and-publish-folders.yml@templates
    parameters:
      BuildNumber: '${{ parameters.BuildNumber }}'
      listOfFolders:
      - ansible
      - scripts
      - scripts-common
      SourceFolder: '$(System.DefaultWorkingDirectory)'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      publish: true
      enabled: true
  - task: AzureCLI@2
    displayName: "Terraform Plan (Cloud Backend) ${{ parameters.EnvPrefix }}"
    inputs:
      azureSubscription: "${{ parameters.azureSubscription }}"
      scriptType: "pscore"
      scriptLocation: "scriptPath"
      scriptPath: "scripts/Tf-Deploy.ps1"
      arguments: '-Token $(TF_TOKEN) -EnvPrefix ${{ parameters.EnvPrefix }} -BuildNumber ${{ parameters.BuildNumber }} -IgnoreTfLint:("${{ parameters.runTfLint }}" -eq "false") -Apply "${{ parameters.runTfApply }}"'
      addSpnToEnvironment: true
      useGlobalConfig: true
    enabled: ${{ parameters.enabled }}
  - task: AzureCLI@2
    displayName: Export the Bootstrap public key for Keyvault
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        $pemFile = (Join-Path $(Build.ArtifactStagingDirectory) bootstrap-${{ parameters.EnvPrefix }}-vnext.pem)
        az sshkey show --name bootstrap --resource-group ${{ parameters.EnvPrefix }}-vnext | Out-File $pemFile
        Write-Host ('##vso[task.setvariable variable={0};issecret=false]{1}' -f 'BootstrapPEMFile', $pemFile)
        Write-Host "'BootstrapPEMFile': $pemFile" -BackgroundColor Green -ForegroundColor Black
      addSpnToEnvironment: true
      useGlobalConfig: true
      failOnStandardError: true
      powerShellIgnoreLASTEXITCODE: false
    enabled: false
  - template: step-az-update-kv-firewall.yaml@templates
    parameters:
      azureSubscription: ${{ parameters.azureSubscription }}
      KeyVaultName: ${{ parameters.EnvPrefix }}-vnext-kv-settings
      Remove: false
  - task: AzureCLI@2
    displayName: "Save Ansible Vault Password ${{ parameters.EnvPrefix }}-vnext-kv-settings"
    inputs:
      azureSubscription: "${{ parameters.azureSubscription }}"
      scriptType: "pscore"
      scriptLocation: "scriptPath"
      scriptPath: "scripts/Upload-ValuesToKeyVaultSecrets.ps1"
      arguments: '-EnvPrefix ${{ parameters.EnvPrefix }} -SecretName "ansibleVaultPassword" -SecretValue "$(AnsibleVaultPass)" -VaultSuffix "settings" -IsEnabled "${{ parameters.SaveSecretsToKeyVault }}"'
      addSpnToEnvironment: true
      useGlobalConfig: true
    enabled: false # ${{ parameters.enabled }}
