# File: step-build-publish-admi-webapp.yml@templates
# --------------------------------------
#   - template: step-build-publish-admi-webapp.yml@templates
#     parameters:
#       AppReleaseVer: '${{ parameters.AppReleaseBranch }}'
#       DeploySlot: '${{ parameters.DeploySlot }}'
#       NugetVerSpec: '6.0.0'
#       ProjectName: 'TeamAdmin'
#       RgName: '$(cicd-0-1-0-adminWebAppRg)'
#       RunDeploy: ${{ parameters.RunDeploy }}
#       ShowParams: ${{ parameters.ShowParams }}
#       SvcAccount: '${{ parameters.SvcAccount}}'
#       VNextRegion: '${{ parameters.VNextRegion}}'
#       WebAppName: '$(cicd-0-1-0-adminWebAppName)'
#       WebpackCsp: '$(cicd-0-1-0-teamAdminCsp)'
# --------------------------------------
parameters:
- name: AppReleaseVer
  type: string
- name: DeploySlot
  type: string
- name: NugetVerSpec
  type: string
  default: '6.0.0'
- name: ProjectName
  type: string
  default: 'TeamAdmin'
- name: RunDeploy
  type: boolean
  default: false
- name: RgName
  type: string
- name: ShowParams
  type: boolean
  default: false
- name: SvcAccount
  type: string
- name: VNextRegion
  type: string
- name: WebAppName
  type: string
- name: WebpackCsp
  type: string

steps:
# ----------------------------------------------------------
- task: PowerShell@2
  displayName: '[debug]: step-build-publish-admi-webapp'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host '-----Template: step-build-publish-admi-webapp-----'
      Write-Host ' AppReleaseVer: ${{ parameters.AppReleaseVer }}'
      Write-Host ' DeploySlot   : ${{ parameters.DeploySlot }}'
      Write-Host ' NugetVerSpec : ${{ parameters.NugetVerSpec }}'
      Write-Host ' ProjectName  : ${{ parameters.ProjectName }}'
      Write-Host ' RgName       : ${{ parameters.RgName }}'
      Write-Host ' SvcAccount   : ${{ parameters.SvcAccount }}'
      Write-Host ' VNextRegion  : ${{ parameters.VNextRegion }}'
      Write-Host ' WebAppName   : ${{ parameters.WebAppName }}'
      Write-Host ' WebpackCsp   : ${{ parameters.WebpackCsp }}'
    showWarnings: true
    pwsh: true
  enabled: ${{ parameters.ShowParams }}
# --------------------------------------
- template: step-nuget-install-restore.yml@templates
  parameters:
    versionSpec: "${{ parameters.NugetVerSpec }}"
    forceReinstallCredentialProvider: true
- template: step-Search-Files-Path.yml@templates
  parameters:
    FileNames:
    - Name: 'Compress-Folder.ps1'
      VarName: 'Compress.Folder.File.Path'
    - Name: 'Lexacom.Panopticon.Primary.csproj'
      VarName: 'Panopticon.Primary.csproj.File.Path'
    - Name: 'Lexacom.Panopticon.Factotum.csproj'
      VarName: 'Panopticon.Factotum.csproj.File.Path'
    - Name: 'Lexacom.Panopticon.Web.csproj'
      VarName: 'Panopticon.Web.csproj.File.Path'
    RootFolder: $(Build.SourcesDirectory)
    ReturnFullPath: true
# --------------------------------------
- template: step-env-build-WebPack.yml@templates
  parameters:
    AppAbbrev: 'admin'
    AuthorityUri: '$(cicd-0-1-0-AuthorityUri)'
    LoginClientId: '$(cicd-0-1-0-teamAdmin--ClientId)'
    ReleaseSourceDir: '$(Build.SourcesDirectory)/lexacom'
    ScriptName: 'build'
    SourceJsPath: '$(Build.SourcesDirectory)\lexacom\js'
    VNextRegion: '${{ parameters.VNextRegion}}'
    WebpackCsp: '${{ parameters.WebpackCsp }}'
    YarnVer: '1.22.19'
# --------------------------------------
- task: PowerShell@2
  displayName: 'Compress ${{ parameters.ProjectName }} WebPack'
  inputs:
    filePath: '$(Compress.Folder.File.Path)'
    arguments: -Source '$(Build.SourcesDirectory)\lexacom\js\teamadminapp\dist\*' -Destination '$(Build.ArtifactStagingDirectory)\TeamAdminApp.zip'
    pwsh: true
  enabled: true
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'TeamAdminWebService_${{ parameters.AppReleaseVer }}_$(Build.BuildNumber)'
    publishLocation: 'Container'
# ----------------------------------------------------------
- template: step-build-env-start-stop-webslot.yml@templates
  parameters:
    Action: 'Stop' # 'Start/Stop'
    DeploySlot: '${{ parameters.DeploySlot }}'
    RgName: '${{ parameters.RgName }}'
    ShowParams: ${{ parameters.ShowParams }}
    SvcAccount: '${{ parameters.SvcAccount }}'
    WebAppName: '${{ parameters.WebAppName }}'
    enabled: ${{ parameters.RunDeploy }}
# ----------------------------------------------------------
- task: AzureRmWebAppDeployment@4
  displayName: 'Deploy the zip as a WebApp'
  inputs:
    ConnectionType: 'AzureRM'
    azureSubscription: '${{ parameters.SvcAccount }}'
    appType: 'webApp'
    WebAppName: '${{ parameters.WebAppName }}'
    deployToSlotOrASE: true
    ResourceGroupName: '${{ lower(parameters.RgName) }}'
    SlotName: '${{ parameters.DeploySlot }}'
    packageForLinux: '$(Build.ArtifactStagingDirectory)\TeamAdminApp.zip'
    enableCustomDeployment: true
    DeploymentType: 'zipDeploy'
  enabled: ${{ parameters.RunDeploy }}
# --------------------------------------
- template: step-build-env-start-stop-webslot.yml@templates
  parameters:
    Action: 'Start' # 'Start/Stop'
    DeploySlot: '${{ parameters.DeploySlot }}'
    RgName: '${{ parameters.RgName }}'
    ShowParams: ${{ parameters.ShowParams }}
    SvcAccount: '${{ parameters.SvcAccount }}'
    WebAppName: '${{ parameters.WebAppName }}'
    enabled: ${{ parameters.RunDeploy }}
# --------------------------------------
