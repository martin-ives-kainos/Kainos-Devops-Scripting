# File: step-install-pwsh-gallery-modules.yml@templates
# --------------------------------------
#   - template: step-install-pwsh-gallery-modules.yml@templates
#     parameters:
#       moduleNames:
#         - name: psdocs
#         - name: importexcel
#         - name: az
#       psRepoName: 'LexacomPSGallery'
#       OrgName: 'lexacom'
#       FeedName: 'LexacomPowerShellGallery'
# -------------------------------------------------------------
# Install modules from internal powershell feed
# -------------------------------------------------------------
parameters:
  - name: moduleNames
    type: object
    default:
      - name: psdocs
      - name: importexcel
      - name: az
  - name: psRepoName
    type: string
    default: 'LexacomPSGallery'
  - name: OrgName
    type: string
    default: 'lexacom'
  - name: FeedName
    type: string
    default: 'LexacomPowerShellGallery'
  - name: ShowParams
    type: boolean
    default: false

steps:
# ----------------------------------------------------------
- task: PowerShell@2
  displayName: '[debug]: step-install-pwsh-gallery-modules'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host '-----Template: step-install-pwsh-gallery-modules-----'
      Write-Host ' moduleNames: ${{ join(';',parameters.moduleNames) }}'
      Write-Host ' psRepoName : ${{ parameters.psRepoName }}'
      Write-Host ' OrgName    : ${{ parameters.OrgName }}'
      Write-Host ' FeedName   : ${{ parameters.FeedName }}'
    showWarnings: true
    pwsh: true
  enabled: ${{ parameters.ShowParams }}
# ----------------------------------------------------------
- ${{ each module in parameters.moduleNames }}:
  - task: PowerShell@2
    displayName: 'Install Module ${{ module.Name }} from ${{ parameters.psRepoName }}'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "====Register ${{ parameters.psRepoName }}===="
        $psRepoName = '${{ parameters.psRepoName }}'
        $orgName = '${{ parameters.OrgName }}'
        $azFeedName = '${{ parameters.FeedName }}'
        $pkgSrcRegFlag = $false
        foreach ($pkgSource in (Get-PackageSource)) {
            Write-Host '--------------------------------------'
            Write-Host "Found Repository: $($pkgSource.Name)"
            Write-Host "                : $($pkgSource.IsTrusted)"
            Write-Host "                : $($pkgSource.Location)"
            Write-Host '--------------------------------------'
            if ($pkgSource.Name -eq $psRepoName) {
                $pkgSrcRegFlag = $true
            }
        }
        $patToken = $env:SYSTEM_ACCESSTOKEN | ConvertTo-SecureString -AsPlainText -Force
        $credentials = New-Object System.Management.Automation.PSCredential($env:SYSTEM_ACCESSTOKEN, $patToken)
        if (!$pkgSrcRegFlag) {
            $SourceLocation = ('https://pkgs.dev.azure.com/{0}/_packaging/{1}/nuget/v2' -f $orgName, $azFeedName)
            Register-PackageSource -ProviderName 'PowerShellGet' -Name $psRepoName -Location $SourceLocation -Credential $Credentials -Trusted
        }
        Write-Host "====Install Module ${{ module.Name }}===="
        $moduleName = '${{ module.Name }}'
        $modInstalled = Get-InstalledModule -Name $moduleName -ErrorAction SilentlyContinue
        if ($null -eq $modInstalled) {
            $foundMod = Find-Module -Name $moduleName -Repository $psRepoName -Credential $credentials -ErrorAction SilentlyContinue
            if ($null -eq $foundMod) {
                Write-Warning ('[{0}|{1}] Unable to find {2} in {3}' -f (Get-Date -Format 'yyyy-MMM-dd HH:mm:ss'), (Split-Path -Leaf $PSCommandPath).Replace('.ps1',''), $moduleName, $psRepoName)
            } else {
              Install-Module -Name $moduleName -Repository $psRepoName -Scope CurrentUser -Credential $credentials
              Import-Module $moduleName -Verbose
            }

        } else {
            Write-Host ('[{0}|{1}] Module {2} v{3} Already Installed' -f (Get-Date -Format 'yyyy-MMM-dd HH:mm:ss'), 'TestPwshGalleryV2', $modInstalled.Name, $modInstalled.Version)
            # $modInstalled
        }
      showWarnings: true
      pwsh: true
    enabled: true
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
