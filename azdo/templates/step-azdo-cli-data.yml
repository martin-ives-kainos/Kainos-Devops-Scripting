# File: templates/step-azdo-cli-data.yml
# - template: templates/step-azdo-cli-data.yml
#   parameters:
#     ModuleName: 'DevopsUtils'
#     ScriptName: 'RunAzDoCliCommand.ps1'
#     OrgUrl: $(System.TeamFoundationCollectionUri)
#     ProjectName: $(System.TeamProject)
#     OutputPath: '$(Build.ArtifactStagingDirectory)'
#     OutputName: WikiList
#     ShowParams: false

parameters:
  - name: Description
    type: string
  - name: ModuleName
    type: string
    default: 'DevopsUtils'
  - name: ScriptName
    type: string
    default: 'RunAzDoCliCommand.ps1'
  - name: OrgUrl
    type: string
    default: $(System.TeamFoundationCollectionUri)
  - name: ProjectName
    type: string
    default: $(System.TeamProject)
  - name: OutputPath
    type: string
    default: '$(Build.ArtifactStagingDirectory)'
  - name: OutputName
    type: string
  - name: ShowParams
    type: boolean
    default: false


steps:
# ----------------------------------------------------------
- task: PowerShell@2
  displayName: '[debug]: step-azdo-cli-data'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host '-----Template: step-azdo-cli-data-----'
      Write-Host '    ModuleName: ${{ parameters.ModuleName }}'
      Write-Host '    ScriptName: ${{ parameters.ScriptName }}'
      Write-Host '        OrgUrl: ${{ parameters.OrgUrl }}'
      Write-Host '   ProjectName: ${{ parameters.ProjectName }}'
      Write-Host '    OutputPath: ${{ parameters.OutputPath }}'
      Write-Host '    OutputName: ${{ parameters.OutputName }}'
    showWarnings: true
    pwsh: true
  enabled: ${{ parameters.ShowParams }}
# ----------------------------------------------------------
- template: step-SearchFilePath.yml
  parameters:
    FileName: ${{ parameters.ScriptName }}
    RootFolder: $(Build.SourcesDirectory)
    varName: 'Script.File.Path'
    ReturnFullPath: true

- task: PowerShell@2
  displayName: '${{ parameters.Description }}'
  inputs:
    filePath: '$(Script.File.Path)'
    arguments: '-mod "${{ parameters.ModuleName }}" -org "${{ parameters.OrgUrl }}" -p "${{ parameters.ProjectName }}" -out "${{ parameters.OutputPath }}" -outname "${{ parameters.OutputName }}"'
    pwsh: true
  enabled: true
  env:
    AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
# ----------------------------------------------------------
- task: PowerShell@2
  displayName: 'T-END: step-azdo-cli-data'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host '-----Template: step-azdo-cli-data-----'
    showWarnings: true
    pwsh: true
  enabled: ${{ parameters.ShowParams }}
# ----------------------------------------------------------