# File: step-tf-backend-update-tokens.yml@templates
# --------------------------------------
#   - template: step-tf-backend-update-tokens.yml@templates
#     parameters:
#       ContainerName: '$(iac.tfstates.container.name)'
#       ResourceGroupName: '$(iac.tfstates.rg.name)'
#       SaKey: '$(iac.tfstates.sa.key)'
#       SaName: '$(iac.tfstates.sa.name)'
#       ShowParams: true
# --------------------------------------
parameters:
- name: ContainerName
  type: string
- name: ResourceGroupName
  type: string
- name: SaKey
  type: string
- name: SaName
  type: string
- name: ShowParams
  type: boolean
  default: false
# --------------------------------------
steps:
- template: step-debug-show-template-params.yml
  parameters:
    TemplateName: 'step-tf-backend-update-tokens.yml'
    enabled: ${{ parameters.ShowParams }}
    SaveParamsToFile: false
    paramValues:
      ResourceGroupName: '${{ parameters.ResourceGroupName }}'
      ContainerName: '${{ parameters.ContainerName }}'
      SaName: '${{ parameters.SaName }}'
      SaKey: '${{ parameters.SaKey }}'
# --------------------------------------
- template: step-Search-Files-Path.yml@templates
  parameters:
    FileNames:
    - Name: 'backend.tf'
      VarName: 'tf.backend.File.Path'
    RootFolder: $(Build.SourcesDirectory)
    ReturnFullPath: true
# ----------------------------------------------------------
- task: replacetokens@6
  displayName: Replace tokens in $(tf.backend.File.Path)
  inputs:
    root: '$(System.DefaultWorkingDirectory)'
    sources: '$(tf.backend.File.Path)'
    additionalVariables: |
      - backend.rg.name: '${{ parameters.ResourceGroupName }}'
      - backend.sa.name: '${{ parameters.SaName }}'
      - backend.container.name: '${{ parameters.ContainerName }}'
      - backend.sa.key: '${{ parameters.SaKey }}'
    tokenPattern: 'custom'
    tokenPrefix: '{'
    tokenSuffix: '}'
    escape: 'off'
    missingVarAction: 'replace'
    ifNoFilesFound: 'error'
# ----------------------------------------------------------
