parameters:
- name: NugetVersionSpec
  type: string
  default: '6.0.0'
- name: ShowParams
  type: boolean
  default: false

steps:
# ----------------------------------------------------------
- task: PowerShell@2
  displayName: '[debug]: step-build-app-solution'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host '-----Template: step-build-app-solution-----'
      Write-Host ' NugetVersionSpec     : ${{ parameters.NugetVersionSpec }}'
#      Write-Host '      : ${{ parameters. }}'
    showWarnings: true
    pwsh: true
  enabled: ${{ parameters.ShowParams }}
# ----------------------------------------------------------
- task: PowerShell@2
  displayName: 'Install .NetFramework 4.7.2 to Agent'
  inputs:
    targetType: 'inline'
    script: |
      choco install netfx-4.7.2-devpack

- task: NuGetToolInstaller@1
  inputs:
    versionSpec: ${{ parameters.NugetVersionSpec }}

- task: NuGetAuthenticate@0
  inputs:
    forceReinstallCredentialProvider: true
