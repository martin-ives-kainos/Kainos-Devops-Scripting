# File: step-env-opensearch-certchain.yml@templates
# --------------------------------------
#   - template: step-env-opensearch-certchain.yml@templates
#     parameters:
#       ESClientCertSecureFile: '$(cicd-envPrefix )-admin.pfx'
#       ESAdminPassword: '$(cicd-?-?-?-elasticAdminPass)'
#       DownloadSecureFile: true
#       ShowParams: true
# --------------------------------------
#       VNextRegion: '${{ parameters.VNextRegion}}'
#       AppAbbrev: 'Pano'
#       ProjectName: 'Panopticon'
#       DeploySlot: '${{ parameters.DeploySlot}}'
# --------------------------------------
parameters:
# ----------------------------------------------------------
  - name: ESClientCertSecureFile
    type: string
  - name: ESAdminPassword
    type: string
  - name: DownloadSecureFile
    type: boolean
    default: true
  - name: ShowParams
    type: boolean
    default: true

steps:
- task: PowerShell@2
  displayName: '[debug]: step-env-opensearch-certchain'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host '-----Template: step-env-opensearch-certchain-----'
      Write-Host 'ESClientCertSecureFile      : ${{ parameters.ESClientCertSecureFile }}'

    showWarnings: true
    pwsh: true
  enabled: ${{ parameters.ShowParams }}
# ----------------------------------------------------------
- task: DownloadSecureFile@1
  displayName: 'Download ES Client Cert ${{ parameters.ESClientCertSecureFile}}'
  name: esAdminCertificate
  inputs:
    secureFile: '${{ parameters.ESClientCertSecureFile}}'
  enabled: ${{ parameters.DownloadSecureFile }}
# --------------------------------------
- template: step-Search-Files-Path.yml@templates
  parameters:
    FileNames:
     - Name: 'root-ca.crt'
       VarName: 'root-ca.File.Path'
     - Name: 'signing_ca.crt'
       VarName: 'signing-ca.File.Path'
    RootFolder: $(Build.SourcesDirectory)
    ReturnFullPath: true

- task: PowerShell@2
  displayName: 'Install ES admin.pfx to Personal Computer store'
  inputs:
    targetType: 'inline'
    script: |
      $pfxpath  = '$(esAdminCertificate.secureFilePath)'
      $password = ConvertTo-SecureString '${{ parameters.ESAdminPassword}}' -AsPlainText -Force

      Import-PfxCertificate -FilePath $pfxpath -CertStoreLocation Cert:\LocalMachine\My -Password $password

- task: PowerShell@2
  displayName: 'Install CA Crt files to Personal Computer store'
  inputs:
    workingDirectory: $(Build.SourcesDirectory)\
    targetType: 'inline'
    script: |
      $rootCert1 = "$(root-ca.File.Path)"
      Import-Certificate -FilePath $rootCert1 -CertStoreLocation Cert:\LocalMachine\root

      $rootCert2 = "$(signing-ca.File.Path)"
      Import-Certificate -FilePath $rootCert2 -CertStoreLocation Cert:\LocalMachine\root