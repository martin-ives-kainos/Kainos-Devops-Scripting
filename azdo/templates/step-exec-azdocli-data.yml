# File: templates/step-exec-azdocli-data.yml
# parameters:
#   DevopsModuleName: DevopsUtils
#   DevopsPAT: $(LexacomPowerShellGallery.PAT)
#   CliCommand: 'az devops service-endpoint list'
#   OutputName: ServiceConnectionsList
#   OutputPath: $(Build.ArtifactStagingDirectory)


parameters:
- name: DevopsModuleName
  type: string
  default: DevopsUtils
- name: DevopsPAT
  type: string
- name: CliCommand
  type: string
- name: OutputName
  type: string
- name: OutputPath
  type: string
  default: $(Build.ArtifactStagingDirectory)
- name: ShowParams
  type: boolean
  default: false

steps:
# ----------------------------------------------------------
- task: PowerShell@2
  displayName: '[debug]: step-exec-azdocli-data'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host '-----Template: step-exec-azdocli-data-----'
      Write-Host 'DevopsModuleName : ${{ parameters.DevopsModuleName }}'
      Write-Host 'DevopsPAT        : ${{ parameters.DevopsPAT }}'
      Write-Host 'CliCommand       : ${{ parameters.CliCommand }}'
      Write-Host 'OutputName       : ${{ parameters.OutputName }}'
      Write-Host 'OutputPath       : ${{ parameters.OutputPath }}'
    showWarnings: true
    pwsh: true
  enabled: ${{ parameters.ShowParams }}
# ----------------------------------------------------------
- template: step-SearchFilePath.yml
  parameters:
    FileName: "${{ parameters.DevopsModuleName }}.psd1"
    RootFolder: "$(Build.SourcesDirectory)"
    varName: "${{ parameters.DevopsModuleName }}.File.Path"
    ReturnFullPath: true
- task: PowerShell@2
  displayName: 'Read AzDevops Service Endpoints'
  inputs:
    filePath: '$(Build.SourcesDirectory)/scripts/AzCliDevopsExec.ps1'
    arguments: '-ModulePath $(${{ parameters.DevopsModuleName }}.File.Path) -AccessToken ${{ parameters.DevopsPAT }} -CliCommand "${{ parameters.CliCommand }}" -OutputPath ${{ parameters.OutputPath }}  -OutputName ${{ parameters.OutputName }} '
    pwsh: true
  enabled: true
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
- task: PublishBuildArtifacts@1
  displayName: '${{ parameters.OutputName }} Publish data files'
  inputs:
    PathtoPublish: "${{ parameters.OutputPath }}"
    ArtifactName: "${{ replace(parameters.OutputName,' ','-') }}-AzResourceData"
    publishLocation: "Container"
  enabled: true

