# File: step-tf-state-backend-armdeploy.yml@templates
# --------------------------------------
#   - template: step-tf-state-backend-armdeploy.yml@templates
#     parameters:
#       ResourceGroupName: '$(iac.tfstates.rg.name)'
#       resourceGroupLocation: '$(iac.env.location)'
#       SvcAccount: '$(iac.svc.connection)'
#       SubId: '$(iac.subscription.id)'
#       SaName: '$(iac.tfstates.sa.name)'
#       ShowParams: true
# --------------------------------------
parameters:
- name: ResourceGroupName
  type: string
- name: resourceGroupLocation
  type: string
- name: SaName
  type: string
- name: SubId
  type: string
- name: SvcAccount
  type: string
- name: ShowParams
  type: boolean
  default: false
# --------------------------------------
steps:
- template: step-debug-show-template-params.yml
  parameters:
    TemplateName: 'step-tf-state-backend-armdeploy.yml'
    enabled: ${{ parameters.ShowParams }}
    SaveParamsToFile: false
    paramValues:
      ResourceGroupName: '${{ parameters.ResourceGroupName }}'
      resourceGroupLocation: '${{ parameters.resourceGroupLocation }}'
      SaName: '${{ parameters.SaName }}'
      SvcAccount: '${{ parameters.SvcAccount }}'
      SubId: '${{ parameters.SubId }}'
# --------------------------------------
- template: step-Search-Files-Path.yml@templates
  parameters:
    FileNames:
    - Name: 'tfstateStorageAccount.template.json'
      VarName: 'tf.sa.template.File.Path'
    - Name: 'tfstateStorageAccount.parameters.json'
      VarName: 'tf.sa.parameters.File.Path'
    RootFolder: $(Build.SourcesDirectory)
    ReturnFullPath: true
# ----------------------------------------------------------
- task: replacetokens@6
  displayName: Replace tokens in $(tf.sa.parameters.File.Path)
  inputs:
    root: '$(System.DefaultWorkingDirectory)'
    sources: '$(tf.sa.parameters.File.Path)'
    additionalVariables: |
      - tf_sa_name: '${{ parameters.SaName }}'
    tokenPattern: 'custom'
    tokenPrefix: '{'
    tokenSuffix: '}'
    escape: 'off'
    missingVarAction: 'replace'
    ifNoFilesFound: 'error'
# ----------------------------------------------------------
- task: AzureResourceManagerTemplateDeployment@3
  displayName: 'Terraform Backend Arm template deploy'
  inputs:
    deploymentScope: 'Resource Group'
    azureResourceManagerConnection: '${{ parameters.SvcAccount }}'
    subscriptionId: '${{ parameters.SubId }}'
    action: 'Create Or Update Resource Group'
    ResourceGroupName: '${{ parameters.ResourceGroupName }}'
    location: '${{ parameters.resourceGroupLocation }}'
    templateLocation: 'Linked artifact'
    csmFile: '$(tf.sa.template.File.Path)'
    csmParametersFile: '$(tf.sa.parameters.File.Path)'
    deploymentMode: 'Incremental'
    deploymentName: '$(Build.BuildNumber)'
