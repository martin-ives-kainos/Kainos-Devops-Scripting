# File: step-Load-Variables-From-Json-File.yml@templates
# --------------------------------------
#   - template: step-Load-Variables-From-Json-File.yml@templates
#     parameters:
#       FileName: 'vars.json'
#       RootFolder: $(Build.SourcesDirectory)
#       showLoadedVariables: false
#       variablePrefix: 'json'
# --------------------------------------
parameters:
  - name: FileName
    type: string
  - name: RootFolder
    type: string
    default: $(Build.SourcesDirectory)
  - name: showLoadedVariables
    type: boolean
    default: false
  - name: variablePrefix
    type: string
    default: json
steps:
  - template: step-SearchFilePath.yml@templates
    parameters:
      FileName: ${{ parameters.FileName }}
      RootFolder: ${{ parameters.RootFolder }}
      varName: 'JsonVar.File.Path'
      ReturnFullPath: true
  - task: oneLuckiDevJson2Variable@1
    displayName: '${{ parameters.FileName }} Load variables'
    inputs:
      jsonFile: '$(JsonVar.File.Path)'
      shouldPrefixVariables: true
      variablePrefix: "${{ parameters.variablePrefix }}"
  # ----------------------------------------------------------
  - task: PowerShell@2
    displayName: "${{ parameters.FileName }} Display"
    inputs:
      targetType: "inline"
      script: |
        Write-Host "-----------------------------------------------"
        $prefix = '${{ parameters.variablePrefix }}'
        Get-ChildItem env: | Where-Object { $_.name.ToUpper().StartsWith($prefix.ToUpper()) } | ForEach-Object {
            try {
                Write-Host "$($_.name):"
                Write-Host "   '$($_.value)'"
            } catch {
                Write-Host '---Failed'
            }
        }
        Write-Host "-----------------------------------------------"
      showWarnings: true
      pwsh: true
    enabled: ${{ parameters.showLoadedVariables }}
