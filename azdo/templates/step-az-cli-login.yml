# File: step-az-cli-login.yml@templates
# --------------------------------------
#   - template: step-az-cli-login.yml@templates
#     parameters:
#       SubscriptionId: 'p_value'
#       UserName: 'p_value'
#       UserPassword: 'p_value'
#       IsEnabled: true
# --------------------------------------
parameters:
- name: SubscriptionId
  type: string
- name: UserName
  type: string
- name: UserPassword
  type: string
- name: IsEnabled
  type: boolean
  default: true

steps:
- task: PowerShell@2
  displayName: '(Pwsh)Login to ${{ parameters.SubscriptionId }}'
  inputs:
    targetType: 'inline'
    script: |
      $azStatus = az account show | ConvertFrom-Json -ErrorAction SilentlyContinue
      if (($null -eq $azStatus) -or ($azStatus.user.name -ne '${{ parameters.UserName }}')) {
        az account set --subscription '${{ parameters.SubscriptionId }}'
        az login -u '${{ parameters.UserName }}' -p '${{ parameters.UserPassword }}'
        az account show
      }
    pwsh: true
  enabled: ${{ parameters.IsEnabled }}