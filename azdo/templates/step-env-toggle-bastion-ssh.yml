# File: step-env-toggle-bastion-ssh.yml@templates
# --------------------------------------
#   - template: step-env-toggle-bastion-ssh.yml@templates
#     parameters:
#       VNextRegion: '${{ parameters.VNextRegion}}'
#       SvcAccount: '${{ parameters.SvcAccount}}'
#       EnvPrefixFull: '$(EnvPrefixFull)'
#       allowOrDeny: 'deny' # deny/allow
#       enabled: true
#       AzLocations:
#         - 'uaenorth'
#         - 'uaecentral'
#         - 'uae'
#         - 'uksouth'
#         - 'ukwest'
#         - 'northeurope'
#         - 'westeurope'
# --------------------------------------
parameters:
- name: VNextRegion
  type: string
  default: uae
- name: SvcAccount
  type: string
- name: EnvPrefixFull
  type: string
- name: AzLocations
  type: object
  default:
  - 'uaenorth'
  - 'uaecentral'
  - 'uae'
  - 'uksouth'
  - 'ukwest'
  - 'northeurope'
  - 'westeurope'
- name: allowOrDeny
  type: string
  default: deny
  values:
  - allow
  - deny
- name: enabled
  type: boolean
  default: true
- name: ShowParams
  type: boolean
  default: false

steps:
# ----------------------------------------------------------
- ${{ if eq(parameters.enabled, 'true') }}:
  - task: PowerShell@2
    displayName: '[debug]: step-env-toggle-bastion-ssh'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host '-----Template: step-env-toggle-bastion-ssh-----'
        Write-Host ' VNextRegion  : ${{ parameters.VNextRegion }}'
        Write-Host ' allowOrDeny  : ${{ parameters.allowOrDeny }}'
        Write-Host ' SvcAccount   : ${{ parameters.SvcAccount }}'
        Write-Host ' EnvPrefixFull: ${{ parameters.EnvPrefixFull }}'
        Write-Host ' AzLocations  : ${{ convertToJson(parameters.AzLocations) }}'
      showWarnings: true
      pwsh: true
    enabled: ${{ parameters.ShowParams }}
  # ----------------------------------------------------------
  # TODO: Implement with
  # variables:
  # - name: environments
  #   value: prod1,prod2
  # steps:
  #   - ${{ each env in split(variables.environments, ',')}}:
  #     - script: ./deploy.sh --environment ${{ env }}
  # ----------------------------------------------------------
  - ${{ each location in parameters.AzLocations }}:
    - task: AzureCLI@2
      displayName: '${{ parameters.allowOrDeny }} ssh_pipelines_${{ location }}'
      inputs:
        azureSubscription: ${{ parameters.SvcAccount }}
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          az network nsg rule update -g ${{ parameters.EnvPrefixFull }} --nsg-name ${{ parameters.EnvPrefixFull }}-nsg-bastion -n ssh_pipelines_${{ location }} --access ${{ parameters.allowOrDeny }}
      ${{ if eq(parameters.allowOrDeny, 'Deny') }}:
        condition:
          always()