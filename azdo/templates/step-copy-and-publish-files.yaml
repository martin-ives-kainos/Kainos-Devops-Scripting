# File: step-copy-and-publish-files.yaml@templates
# --------------------------------------
#   - template: step-copy-and-publish-files.yaml@templates
#     parameters:
#       Name: 'p_value'
#       SourceFolder: '$(System.DefaultWorkingDirectory)'
#       Contents: '**'
#       TargetFolder: '$(Build.ArtifactStagingDirectory)'
#       CleanTargetFolder: false
#       OverWrite: true
#       flattenFolders: false
#       publish: false
#       enabled: true
# --------------------------------------
parameters:
- name: Name
  type: string
- name: SourceFolder
  type: string
  default: '$(System.DefaultWorkingDirectory)'
- name: Contents
  type: object
  default: '**'
- name: TargetFolder
  type: string
  default: '$(Build.ArtifactStagingDirectory)'
- name: CleanTargetFolder
  type: boolean
  default: false
- name: OverWrite
  type: boolean
  default: true
- name: flattenFolders
  type: boolean
  default: false
- name: publish
  type: boolean
  default: false
- name: enabled
  type: boolean
  default: true

steps:
- task: CopyFiles@2
  displayName: 'Copy ${{ parameters.Contents }} from ${{ parameters.SourceFolder }} to $(Build.ArtifactStagingDirectory)'
  inputs:
    SourceFolder: '${{ parameters.SourceFolder }}'
    Contents: ${{ parameters.Contents }}
    TargetFolder: '${{ parameters.TargetFolder }}/${{ parameters.Name }}'
    CleanTargetFolder: ${{ parameters.CleanTargetFolder }}
    OverWrite: ${{ parameters.TargetFolder }}
    flattenFolders: ${{ parameters.OverWrite }}
  enabled: ${{ parameters.enabled }}
- task: PublishBuildArtifacts@1
  condition: and(succeeded(), eq('${{ parameters.publish }}', 'true'))
  displayName: Publish ${{ parameters.Name }} Artifacts
  inputs:
    PathtoPublish: '${{ parameters.TargetFolder }}/${{ parameters.Name }}'
    ArtifactName: '${{ parameters.Name }}'
    publishLocation: 'Container'
  enabled: ${{ parameters.enabled }}
