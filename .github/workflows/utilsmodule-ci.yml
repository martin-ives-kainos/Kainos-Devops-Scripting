name: UtilsModule CI

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'PowerShell/UtilsModule/**'
      - '.github/workflows/utilsmodule-ci.yml'

permissions:
  contents: read
  checks: write

env:
  MODULE_ROOT: ${{ github.workspace }}/PowerShell/UtilsModule
  TEST_RESULTS_DIR: ${{ github.workspace }}/TestResults

jobs:
  validate-and-test:
    name: Validate & Test (PowerShell 7)
    # Windows runner required for WPF/dialog/Excel related functions
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show PowerShell version
        run: |
          $PSVersionTable | Format-Table -AutoSize
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7+ is required." }

      - name: TEST Find script
        shell: pwsh
        run: |
          Write-Host "Here is the workspace: ${{ github.workspace }}"
          Get-ChildItem -Path ${{ github.workspace }} -Recurse -Filter 'wf-*.ps1' -Force
          Write-Host "Finished listing files in the module root."

